# Fly.io config for the PRIVATE GReply preview. DEMO ONLY.
#
# PRIVATE BY DESIGN: there is no [http_service] and no public [[services.ports]]
# mapping, so Fly allocates no public IP for this app. Reach it over the private
# 6PN network with `fly proxy 8080` (or the org WireGuard tunnel), or put
# Cloudflare Access in front. Secrets are set out-of-band, never committed:
#   fly secrets set GBP_SESSION_SECRET=... GBP_DEMO_PASSWORD=...
#
# Runbook, cost and the exact approvals needed: docs/PREVIEW-DEPLOY.md
app = "greply-preview"
primary_region = "sjc"

[build]
  dockerfile = "preview/Dockerfile"

[env]
  GBP_PREVIEW = "1"
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Health check target is the login page: a 200 there proves the app booted with
# auth enabled. It is checked over the machine's private network only.
[checks.health]
  type = "http"
  port = 8080
  path = "/"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
