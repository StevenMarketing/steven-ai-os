<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steven AI OS · Collaboration Room</title>
<style>body{margin:0;background:#0c1522;color:#e2e8f0;font:15px system-ui}header,main{padding:24px;max-width:1250px;margin:auto}header{border-bottom:1px solid #29354b}h1{font-size:26px;margin:6px 0}small,.muted{color:#9baec6}.badge{color:#f4ce77}section{background:#142133;border:1px solid #29354b;border-radius:12px;padding:20px;margin:12px 0}input,select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #41526a;background:#0c1522;color:inherit;max-width:100%;box-sizing:border-box}button{background:#2751c4;cursor:pointer}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1}#grid{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}.card{padding:12px 0;border-bottom:1px solid #29354b;overflow-wrap:anywhere}#notice{color:#f4ce77}#chat{max-height:320px;overflow:auto}label{display:flex;align-items:center;gap:6px}@media(max-width:800px){#grid{display:block}header,main{padding:16px}}</style>
<header><small>STEVEN AI OS / OPERATIONS</small><h1>AI Collaboration Room</h1><span class="badge">ISOLATED PROTOTYPE · DỮ LIỆU THỬ NGHIỆM</span><p class="muted">Chưa kết nối production. Không nhập secrets hoặc dữ liệu khách hàng.</p></header><main>
<section id="login"><h2>Mở phòng thử nghiệm</h2><form id="auth"><input id="token" type="password" aria-label="Access token" placeholder="Owner token" autocomplete="off" required><button>Kết nối</button></form><small>Token chỉ giữ trong bộ nhớ tab, mất khi tải lại trang.</small></section><p id="notice" role="status"></p>
<div id="room" hidden><button id="logout">Khóa phòng</button><div id="grid"><div><section><h2>Agent registry</h2><div id="agents"></div></section><section><h2>Audit log</h2><div id="audit"></div></section></div><div><section><h2>Phòng trao đổi</h2><div id="chat"></div><form id="message"><input id="messageText" maxlength="2000" placeholder="Tin nhắn thử nghiệm…" required><button>Gửi</button></form></section><section><h2>Nhiệm vụ</h2><form id="task"><input id="title" maxlength="240" placeholder="Mục tiêu thử nghiệm" required><select id="owner" aria-label="Task owner"><option value="simulator">SIMULATOR</option value="chatgpt">ChatGPT · chưa kết nối</option><option value="muse">Muse · chưa kết nối</option><option value="hermes">Hermes · chưa kết nối</option></select><select id="priority" aria-label="Priority"><option>normal</option><option>high</option><option>low</option></select><label><input id="risk" type="checkbox">Cần phê duyệt</label><button>Tạo</button></form><div id="tasks"></div></section></div></div></div>
<script>
let secret='',timer;const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+secret,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data}function text(parent,tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el}function draw(id,rows,fn){$(id).replaceChildren();rows.forEach(row=>{const el=text($(id),'div','','card');fn(el,row)})}async function refresh(){try{const s=await api('state');$('notice').textContent='Đã đồng bộ · '+new Date().toLocaleTimeString();draw('agents',s.agents,(e,a)=>{text(e,'strong',a.name);text(e,'p',a.integration==='not_connected'?'CHƯA KẾT NỐI':'AGENT MÔ PHỎNG · không gọi AI');});draw('chat',s.messages,(e,m)=>{text(e,'small','Sếp · HUMAN · '+new Date(m.at).toLocaleTimeString());text(e,'p',m.text)});draw('tasks',s.tasks,(e,t)=>{text(e,'strong',t.title);text(e,'p',t.owner+' / '+t.priority+' / '+t.state);text(e,'small',t.id+' · lần '+t.attempt);if(t.result)text(e,'p',t.result);if(t.owner==='simulator'&&t.state==='queued'){const b=text(e,'button','Chạy mô phỏng');b.onclick=()=>run(()=>api('simulate',{id:t.id}));}});draw('audit',s.audit.slice(0,12),(e,a)=>text(e,'small',a.actor+' · '+a.action+' · '+new Date(a.at).toLocaleTimeString()));$('room').hidden=false;$('login').hidden=true;}catch(e){$('notice').textContent='Mất kết nối / chưa xác thực: '+e.message;throw e}}async function run(fn){try{await fn();await refresh()}catch(e){$('notice').textContent='Không hoàn tất: '+e.message}}$('auth').onsubmit=e=>{e.preventDefault();secret=$('token').value;$('token').value='';run(async()=>{await refresh();clearInterval(timer);timer=setInterval(()=>refresh().catch(()=>{}),5000)})};$('logout').onclick=()=>{clearInterval(timer);secret='';$('room').hidden=true;$('login').hidden=false;for(const id of ['chat','tasks','audit','agents'])$(id).replaceChildren();$('notice').textContent='Đã khóa phòng'};$('message').onsubmit=e=>{e.preventDefault();run(async()=>{await api('messages',{text:$('messageText').value});$('messageText').value=''})};$('task').onsubmit=e=>{e.preventDefault();const body={title:$('title').value,owner:$('owner').value,priority:$('priority').value,risk:$('risk').checked,idem:crypto.randomUUID()};run(async()=>{await api('tasks',body);$('title').value=''})};
</script></main></html>
